app:
  version: '@project.version@'

spring:
  application:
    name: event

  config:
    import:
      - classpath:config/keycloak-config.yml

  web:
    mvc:
      servlet:
        path: /${spring.application.name}

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/event-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/patungan-ku

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:19000/eureka/
    healthcheck:
      enabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://host.docker.internal:9411/api/v2/spans

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    config-url: /event/v3/api-docs/swagger-config
    urls:
      - name: API - V1
        url: /event/v3/api-docs/API - V1
    urls-primary-name: API - V1

logging:
  level:
    id.patunganku.event_service: DEBUG